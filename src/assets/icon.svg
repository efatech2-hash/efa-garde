<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 20% border radius squircle (512 * 0.20 = 102.4) for Google Play Store -->
    <clipPath id="playStoreClip">
      <rect x="0" y="0" width="512" height="512" rx="102.4" ry="102.4" />
    </clipPath>
  </defs>

  <!-- Blue Background: exact logo blue #0b5cb5 -->
  <g clip-path="url(#playStoreClip)">
    <rect width="512" height="512" fill="#0b5cb5" />

    <!-- Centered Shield & Medical Cross (No text, pure white) -->
    <!-- Scaled and centered to fit beautifully inside the 512x512 squircle -->
    <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
      <!-- Upper Hexagonal Crown Shield -->
      <path
        d="M 256,70 
           L 388,136 
           L 388,248 
           L 124,248 
           L 124,136 
           Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Middle Divider Bar with Shoulders and Lower Curved Shield -->
      <path
        d="M 110,266 
           H 402 
           V 288 
           C 392,292 388,298 388,310 
           C 388,376 332,424 256,446 
           C 180,424 124,376 124,310 
           C 124,298 120,292 110,288 
           Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Medical Cross (+) perfectly centered in the shield -->
      <!-- Vertical beam -->
      <rect
        x="232"
        y="210"
        width="48"
        height="146"
        rx="8"
        ry="8"
        fill="#ffffff"
      />
      <!-- Horizontal beam -->
      <rect
        x="183"
        y="259"
        width="146"
        height="48"
        rx="8"
        ry="8"
        fill="#ffffff"
      />
    </g>
  </g>
</svg>
